<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HarmonyHike</title>
<link rel="icon" href="assets/icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="top" class="glass">
    <label class="loc">Location <input id="location" type="text" placeholder="place name, or latitude, longitude" spellcheck="false"></label>
    <button id="go">Go</button>
    <button id="clear-hikers">Clear Hikers</button>
    <span id="status"></span>
    <button id="about-btn">About</button>
  </header>
  <div id="modes" class="glass">
    <button id="mode-rotate" class="on">Rotate Map</button>
    <button id="mode-manage">Manage Hikers</button>
    <button id="reset-view">Reset View</button>
    <button id="zoom-out">Zoom -</button>
    <button id="zoom-in">Zoom +</button>
    <button id="pause">Pause</button>
    <button id="fullscreen">Full screen</button>
    <button id="panel-toggle" title="Show or hide the hiker panel">Hiker panel</button>
    <span id="clock-status"></span>
  </div>
  <main id="stage">
    <div id="map"><canvas id="gl"></canvas><canvas id="overlay"></canvas></div>
    <aside id="hiker-panel" class="glass"></aside>
  </main>
  <nav id="tabs" class="glass"></nav>
  <section id="pages" class="glass"></section>
</div>
<div id="start">
  <div class="card glass">
    <img src="assets/icon.png" alt="" width="96" height="96">
    <h1>HarmonyHike</h1>
    <p>Little hikers walk a real piece of the Earth and play music from the ground under their feet: its height, slope, tiredness, land type and temperature.</p>
    <button id="start-btn" class="big">Start</button>
    <p class="small" id="start-note">Sound needs a click to begin. Best with headphones. Maps come from OpenStreetMap and AWS Terrain Tiles.</p>
  </div>
</div>
<div id="dialog-root"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
